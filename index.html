<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>final prototype</title>
<style>
:root{--bg:#f2f2f0;--surface:#fff;--ink:#222;--mute:#666;--line:#999;--ok:#2d6a3e;--bad:#a33a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1a;--surface:#262625;--ink:#eee;--mute:#aaa;--line:#777;--ok:#7fcf93;--bad:#ef9a8a}}
:root[data-theme="dark"]{--bg:#1b1b1a;--surface:#262625;--ink:#eee;--mute:#aaa;--line:#777;--ok:#7fcf93;--bad:#ef9a8a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;line-height:1.45;font-size:16px}
body{padding:16px;display:flex;justify-content:center}
.phone{width:100%;max-width:400px;border:2px solid var(--line);border-radius:18px;background:var(--surface);padding:16px;min-height:600px;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);border-bottom:1px dashed var(--line);padding-bottom:6px}
h2{font-size:20px;margin:0}p{margin:0}
.mute{color:var(--mute);font-size:14px}
button{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;text-align:left;min-height:44px}
button:hover{border-style:dashed}
button:active{background:var(--ink);color:var(--surface)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.primary{border-color:var(--ink);border-width:3px;text-align:center;font-weight:bold}
.big{padding:16px;font-size:17px}
.tabs{display:flex;gap:4px}.tabs button{flex:1;padding:6px 2px;font-size:11px;text-align:center;min-height:36px}.tabs .on{border-color:var(--ink);font-weight:bold}
.toast{border:2px solid var(--ok);border-radius:8px;padding:8px 10px;color:var(--ok);font-weight:bold}
.comp{border:2px solid var(--line);border-radius:8px;padding:10px}.comp.full{border-color:var(--bad)}.comp.hit{border-style:dashed;border-color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meter{height:14px;border:2px solid var(--line);border-radius:4px;margin:6px 0 2px}.meter i{display:block;height:100%;background:var(--line)}
.chip{font-size:12px;border:1px dashed var(--line);border-radius:10px;padding:1px 8px;white-space:nowrap}
.alert{border:2px solid var(--bad);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.alert b{color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res{border:2px solid var(--ok);border-radius:8px;padding:10px}.res.chk{border-color:var(--bad)}
.row{display:flex;gap:8px}.row button{flex:1;text-align:center}
.step{display:flex;gap:10px;align-items:center;border:2px dashed var(--line);border-radius:8px;padding:8px}
.ic{font-size:22px;width:32px;text-align:center;flex:none}
.stat{font-size:44px;font-weight:bold;line-height:1.1}
.srow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:17px}
.count{font-size:24px;font-weight:bold}
.note{font-size:12px;color:var(--mute);border-top:1px dashed var(--line);padding-top:8px;margin-top:auto}
</style>
</head>
<body>
<main class="phone" id="app" aria-live="polite"></main>
<script>
var ITEMS=[
{n:"Banana peel",c:"wet",a:10},{n:"Leftover food",c:"wet",a:12},
{n:"Plastic bottle",c:"dry",a:8},{n:"Clean paper",c:"dry",a:8},
{n:"Paper plate with food",c:"mixed",a:12},{n:"Paper cup",c:"mixed",a:10},
{n:"Tetra pack",c:"mixed",a:10},{n:"Toothpaste tube",c:"mixed",a:8}
];
var COMPS=[{k:"wet",t:"Wet",s:"Green"},{k:"dry",t:"Dry",s:"Blue"},{k:"mixed",t:"Mixed / unsure",s:"Grey"}];
var IC={wet:"🍌",dry:"🧴",mixed:"📦"};
var NAMES={status:"Status",drop:"Drop",alerts:"Alerts",empty:"Empty",summary:"Summary"};
var ORDER=["drop","status","alerts","empty","summary"];
var st,tm;
function fresh(){return{s:"status",lv:{wet:30,dry:20,mixed:10},mixedN:0,sorted:0,last:null,busy:false,proc:false,toast:"",em:{wet:0,dry:0,mixed:0},t0:null,t1:null}}
st=fresh();
var app=document.getElementById("app");
function C(k){return COMPS.filter(function(c){return c.k===k})[0]}
function nm(k){return C(k).t}
function status(v){return v>=100?"Full":v>=80?"Nearly full":"Ready"}
function toast(m){st.toast=m;render();clearTimeout(tm);tm=setTimeout(function(){st.toast="";render()},1800)}
function go(s,m){st.s=s;if(s==="empty"&&!st.t0)st.t0=Date.now();if(m)toast(m);else render()}
function drop(i){
 if(st.busy)return;st.busy=true;st.last={i:i,done:false};toast("Got it. Sorting "+ITEMS[i].n.toLowerCase()+"…");
 setTimeout(function(){var it=ITEMS[i];st.lv[it.c]=Math.min(100,st.lv[it.c]+it.a);st.sorted++;if(it.c==="mixed")st.mixedN++;st.last.done=true;st.busy=false;toast(it.n+" sorted to the "+nm(it.c).toLowerCase()+" compartment")},800);
}
function emp(k){if(st.lv[k]===0)return;if(!st.t0)st.t0=Date.now();st.em[k]++;st.lv[k]=0;if(k==="mixed")st.mixedN=0;toast(nm(k)+" compartment emptied. Status: Ready.")}
function confirmAll(){if(st.proc)return;st.t1=Date.now();st.proc=true;toast("Confirmed. Processing…");setTimeout(function(){st.proc=false;st.toast="";go("summary")},800)}
function reset(){st=fresh();render()}
function bs(){var need=st.mixedN>0||COMPS.some(function(c){return st.lv[c.k]>=80});return st.busy||st.proc?"Processing":need?"Needs emptying":"Ready"}
function tabs(){return '<div class="tabs">'+ORDER.map(function(x,i){return '<button class="'+(st.s===x?'on':'')+'" onclick="go(\''+x+'\')">'+(i+1)+' '+NAMES[x]+'</button>'}).join("")+'</div>'}
function comp(c){var v=st.lv[c.k],s=status(v);
 return '<div class="comp '+(s==="Full"?'full':'')+'"><div class="top"><b>'+IC[c.k]+' '+c.t+'</b><span class="chip">'+c.s+' · '+s+'</span></div><div class="meter" role="img" aria-label="'+c.t+' '+v+' percent full"><i style="width:'+v+'%"></i></div><span class="mute">'+v+'% full'+(c.k==="mixed"&&st.mixedN?' · '+st.mixedN+' item'+(st.mixedN>1?'s':'')+' to check':'')+'</span></div>'}
function alerts(){var a=[];
 COMPS.forEach(function(c){var v=st.lv[c.k];if(v>=80)a.push({t:c.t+" compartment is "+status(v).toLowerCase(),d:v+"% full"})});
 if(st.mixedN)a.push({t:"Mixed / unsure compartment needs a check",d:st.mixedN+" item"+(st.mixedN>1?"s":"")+" the bin could not sort cleanly"});
 return a}
function step(i,e,t){return '<div class="step"><span class="ic">'+e+'</span><span><b>Step '+i+'.</b> '+t+'</span></div>'}
function render(){
 var h='<div class="bar"><span>Smart bin · '+(st.s==="drop"?"facilitator":"staff")+' view</span><span>Step '+(ORDER.indexOf(st.s)+1)+' of 5</span></div>'+tabs()+(st.toast?'<div class="toast" role="status">✔ '+st.toast+'</div>':''),s=st.s,al=alerts();
 if(s==="status"){
  h+='<h2>Bin station status</h2><div class="comp"><b>Bin status: '+bs()+'</b><br><span class="mute">Ready = taking waste · Processing = sorting · Needs emptying = act now</span></div>'+COMPS.map(comp).join("")+
  (al.length?'<button class="alert" onclick="go(\'alerts\',\'Opening alerts\')"><b>⚠ '+al.length+' alert'+(al.length>1?'s':'')+'</b><span class="mute">Press here to see what to do ➜</span></button>':'<p class="mute">✔ No alerts. All compartments are Ready.</p>')+
  '<div class="row"><button onclick="go(\'drop\',\'Opening drop simulation\')">Facilitator: simulate drop</button><button class="primary" onclick="go(\'empty\',\'Opening empty bin\')">🗑 Empty bin</button></div>';
 }else if(s==="drop"){
  h+='<h2>Drop waste (simulated)</h2><p class="mute">Facilitator only: simulate a student dropping an item. The bin sorts it into a compartment by itself.</p><div class="comp"><b>Bin status: '+bs()+'</b></div><div class="grid">'+ITEMS.map(function(x,i){return '<button onclick="drop('+i+')"'+(st.busy?' disabled':'')+'>'+x.n+'</button>'}).join("")+'</div>';
  if(st.last&&st.last.done){var it=ITEMS[st.last.i];h+='<div class="res '+(it.c==="mixed"?'chk':'')+'"><b>'+it.n+' sorted to: '+nm(it.c)+'</b><p class="mute">'+(it.c==="mixed"?'Several materials joined, so it needs a staff check.':'No staff action needed.')+'</p></div>'}
  h+='<div class="comp">'+COMPS.map(function(c){return c.t+' '+st.lv[c.k]+'%'}).join(' · ')+'</div>';
 }else if(s==="alerts"){
  h+='<h2>Alerts</h2><div class="comp"><b>What to do</b><br><span class="mute">1. Read the alert. 2. Press the button under it.</span></div>'+
  (al.length?al.map(function(a){return '<div class="alert"><b>⚠ '+a.t+'</b><span class="mute">'+a.d+'</span><button class="primary big" onclick="go(\'empty\',\'Opening empty bin\')">➜ Go to Empty bin</button></div>'}).join(""):'<p class="mute">✔ No alerts right now.</p>');
 }else if(s==="empty"){
  var any=st.em.wet+st.em.dry+st.em.mixed>0;
  h+='<h2>Empty and confirm</h2><div class="comp"><b>How to prepare the waste</b></div>'+
  step(1,"📦","Check the Mixed / unsure compartment first.")+step(2,"🗑","Empty each full compartment.")+step(3,"🏷","Tie the bag and label it Wet, Dry or Mixed.")+step(4,"✔","Press Confirm. Status shows Processing, then Ready.")+
  ["mixed","wet","dry"].map(function(k){var c=C(k);return '<button class="big" onclick="emp(\''+k+'\')"'+(st.lv[k]===0?' disabled':'')+'><b>'+IC[k]+' '+(k==="mixed"?'Check and empty ':'Empty ')+c.t.toLowerCase()+'</b><br><span class="mute">'+(st.lv[k]===0?'Already emptied. Status: Ready.':st.lv[k]+'% full. Takes out the waste shown and sets status to Ready.')+'</span></button>'}).join("")+
  '<button class="primary big" onclick="confirmAll()"'+(any&&!st.proc?'':' disabled')+'>✔ Confirm and send for disposal<br><span class="mute">Press when you have emptied what you need to.</span></button>';
 }else{
  var secs=st.t0&&st.t1?Math.round((st.t1-st.t0)/1000):0;
  var bins=(st.em.wet>0?1:0)+(st.em.dry>0?1:0)+(st.em.mixed>0?1:0);
  h+='<h2>Waste collection summary</h2><div class="stat">'+bins+'</div><p class="mute">Number of bins waste collected from</p>'+
  '<div class="srow"><span>🍌 Wet bin emptied</span><span class="count">'+st.em.wet+'</span></div>'+
  '<div class="srow"><span>🧴 Dry bin emptied</span><span class="count">'+st.em.dry+'</span></div>'+
  '<div class="srow"><span>📦 Mixed bin emptied</span><span class="count">'+st.em.mixed+'</span></div>'+
  '<div class="srow"><span>Items sorted by the bin</span><span class="count">'+st.sorted+'</span></div>'+
  '<div class="srow"><span>⚠ Mixed items still to check</span><span class="count">'+st.mixedN+'</span></div>'+
  '<div class="srow"><span>⏱ Time to clear</span><span class="count">'+secs+' s</span></div>'+
  '<div class="row"><button class="big" onclick="go(\'status\',\'Back to status\')">Back to status</button><button class="primary big" onclick="reset()">Reset</button></div>';
 }
 
 app.innerHTML=h;
}
render();
</script>
</body>
</html>
